<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freight Checker</title>
<style>
body{font-family:Arial,sans-serif;background:#111827;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#1f2937;padding:30px;border-radius:18px;width:90%;max-width:500px;text-align:center;box-shadow:0 10px 30px #0008}h1{margin-top:0}p{color:#cbd5e1}input,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;font-size:16px;box-sizing:border-box}input{border:0}button{border:0;background:#2563eb;color:white;font-weight:bold;cursor:pointer}button:hover{background:#1d4ed8}small{display:block;color:#94a3b8;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h1>🚆 Freight Checker</h1>
<p>Select a date to check the freight trains at Felixstowe North (FNC).</p>
<input type="date" id="dateInput">
<button onclick="checkFreight()">Check For Freight</button>
<small>Opens the selected day's RealTimeTrains freight timetable.</small>
</div>
<script>
const dateInput=document.getElementById("dateInput");
const today=new Date();
const yyyy=today.getFullYear();
const mm=String(today.getMonth()+1).padStart(2,"0");
const dd=String(today.getDate()).padStart(2,"0");
dateInput.value=`${yyyy}-${mm}-${dd}`;
function checkFreight(){
 const date=dateInput.value;
 if(!date){alert("Please choose a date first.");return;}
 const url=`https://www.realtimetrains.co.uk/search/detailed/gb-nr:FNC/${date}/0000-2359?stp=WVS&show=all&order=wtt&toc=ZZ`;
 window.location.href=url;
}
</script>
</body>
</html>
